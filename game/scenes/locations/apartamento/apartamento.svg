  <circle cx="276" cy="352" r="11" fill="#d8b04c" stroke="#2b2118" stroke-width="3"/>
  <rect x="244" y="346" width="34" height="12" rx="6" fill="#d8b04c" stroke="#2b2118" stroke-width="3"/>

