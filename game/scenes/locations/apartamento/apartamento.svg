  <line x1="790" y1="470" x2="880" y2="470" stroke="#2b2118" stroke-width="3"/>
  <circle cx="835" cy="495" r="5" fill="#2b2118"/>
  <path d="M806 420 q-6 -50 10 -80 h38 q16 30 10 80 z" fill="#c26b45" stroke="#2b2118" stroke-width="4"/>
