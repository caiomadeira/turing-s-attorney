<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Apartamento 12, por dentro. Arte provisória. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ddd0"/>
      <stop offset="1" stop-color="#b3cbbd"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c7a58"/>
      <stop offset="1" stop-color="#7d5e41"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2550"/>
      <stop offset="1" stop-color="#4a3f7a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fd3ff"/>
      <stop offset="1" stop-color="#1867c9"/>
    </linearGradient>
    <radialGradient id="rgb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5ad1"/>
      <stop offset="0.6" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#28d7ff"/>
    </radialGradient>
    <radialGradient id="screenglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fe3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fe3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

