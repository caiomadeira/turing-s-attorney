    <line x1="0" y1="690" x2="1280" y2="690"/>
    <line x1="140" y1="528" x2="140" y2="575"/><line x1="520" y1="528" x2="520" y2="575"/>
    <line x1="900" y1="528" x2="900" y2="575"/><line x1="330" y1="575" x2="330" y2="630"/>
