  <rect x="540" y="440" width="120" height="16" rx="6" fill="#33313f" stroke="#2b2118" stroke-width="3"/>
  <rect x="552" y="384" width="96" height="58" rx="12" fill="#3f3d50" stroke="#2b2118" stroke-width="4"/>
  <line x1="600" y1="456" x2="600" y2="508" stroke="#2b2118" stroke-width="8"/>
  <path d="M560 520 l40 -12 l40 12" fill="none" stroke="#2b2118" stroke-width="6" stroke-linecap="round"/>

