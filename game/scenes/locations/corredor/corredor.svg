<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Corredor do Edifício Transformer, porta do apartamento 12. Arte provisória. -->
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4f33"/>
      <stop offset="1" stop-color="#5c3923"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6d3ad"/>
      <stop offset="1" stop-color="#d4bd92"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa3ab"/>
      <stop offset="0.5" stop-color="#cdd4da"/>
      <stop offset="1" stop-color="#8e979f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- parede -->
  <rect width="1280" height="545" fill="url(#wall)"/>
  <g stroke="#c9b083" stroke-width="3">
    <line x1="40" y1="40" x2="40" y2="530"/><line x1="320" y1="40" x2="320" y2="530"/>
    <line x1="400" y1="40" x2="400" y2="530"/><line x1="880" y1="40" x2="880" y2="530"/>
    <line x1="960" y1="40" x2="960" y2="530"/><line x1="1040" y1="40" x2="1040" y2="530"/>
    <line x1="1120" y1="40" x2="1120" y2="530"/><line x1="1200" y1="40" x2="1200" y2="530"/>
  </g>
  <!-- moldura do teto -->
  <rect width="1280" height="40" fill="#f2e6cc"/>
  <rect y="36" width="1280" height="8" fill="#b89a68"/>
  <!-- rodapé e chão -->
  <rect y="530" width="1280" height="18" fill="#4a2d1b"/>
  <rect y="548" width="1280" height="172" fill="url(#floor)"/>
  <g stroke="#4a2d1b" stroke-width="3" opacity="0.6">
    <line x1="0" y1="590" x2="1280" y2="590"/><line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="0" y1="695" x2="1280" y2="695"/>
    <line x1="180" y1="548" x2="180" y2="590"/><line x1="610" y1="548" x2="610" y2="590"/>
    <line x1="1010" y1="548" x2="1010" y2="590"/><line x1="90" y1="590" x2="90" y2="640"/>
    <line x1="470" y1="590" x2="470" y2="640"/><line x1="890" y1="590" x2="890" y2="640"/>
    <line x1="1190" y1="590" x2="1190" y2="640"/><line x1="300" y1="640" x2="300" y2="695"/>
    <line x1="760" y1="640" x2="760" y2="695"/><line x1="1100" y1="640" x2="1100" y2="695"/>
  </g>

  <!-- luminária do teto -->
  <ellipse cx="640" cy="60" rx="220" ry="70" fill="url(#glow)"/>
  <rect x="590" y="44" width="100" height="16" rx="6" fill="#f7efd8" stroke="#2b2118" stroke-width="3"/>

  <!-- elevador (saída para a portaria) -->
  <rect x="70" y="170" width="200" height="362" fill="#8b7a62" stroke="#2b2118" stroke-width="4"/>
  <rect x="88" y="190" width="164" height="342" fill="url(#steel)" stroke="#2b2118" stroke-width="3"/>
  <line x1="170" y1="190" x2="170" y2="532" stroke="#2b2118" stroke-width="3"/>
  <rect x="120" y="128" width="100" height="30" rx="4" fill="#2b2118"/>
  <path d="M150 150 l10 -14 l10 14 z" fill="#ffb347"/>
  <path d="M180 136 l10 14 l10 -14 z" fill="#5c5c5c"/>
  <rect x="284" y="320" width="24" height="56" rx="4" fill="#cdd4da" stroke="#2b2118" stroke-width="3"/>
  <circle cx="296" cy="336" r="6" fill="#ffb347" stroke="#2b2118" stroke-width="2"/>
  <circle cx="296" cy="360" r="6" fill="#ffffff" stroke="#2b2118" stroke-width="2"/>

  <!-- arandelas -->
  <ellipse cx="440" cy="250" rx="60" ry="60" fill="url(#glow)"/>
  <ellipse cx="840" cy="250" rx="60" ry="60" fill="url(#glow)"/>
  <path d="M424 232 h32 l-8 36 h-16 z" fill="#fff3c4" stroke="#2b2118" stroke-width="3"/>
  <path d="M824 232 h32 l-8 36 h-16 z" fill="#fff3c4" stroke="#2b2118" stroke-width="3"/>

  <!-- porta do apartamento 12 -->
  <rect x="496" y="128" width="288" height="404" fill="#f5ead2" stroke="#2b2118" stroke-width="4"/>
  <rect x="520" y="150" width="240" height="382" fill="#7b4a2a" stroke="#2b2118" stroke-width="4"/>
  <rect x="546" y="176" width="188" height="140" rx="4" fill="none" stroke="#5a3219" stroke-width="5"/>
  <rect x="546" y="350" width="188" height="160" rx="4" fill="none" stroke="#5a3219" stroke-width="5"/>
  <line x1="560" y1="190" x2="560" y2="300" stroke="#9a6440" stroke-width="4" opacity="0.6"/>
  <line x1="560" y1="364" x2="560" y2="494" stroke="#9a6440" stroke-width="4" opacity="0.6"/>
  <!-- placa "12" -->
  <rect x="610" y="196" width="60" height="36" rx="5" fill="#d8b04c" stroke="#2b2118" stroke-width="3"/>
  <path d="M624 206 l6 -4 v24" fill="none" stroke="#2b2118" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M642 208 q8 -8 16 0 q4 6 -4 12 l-12 6 h18" fill="none" stroke="#2b2118" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- olho mágico -->
  <circle cx="640" cy="276" r="15" fill="#d8b04c" stroke="#2b2118" stroke-width="3"/>
  <circle cx="640" cy="276" r="8" fill="#1c2a33"/>
  <circle cx="637" cy="273" r="3" fill="#9fd6ff"/>
  <!-- maçaneta -->
  <circle cx="728" cy="372" r="12" fill="#d8b04c" stroke="#2b2118" stroke-width="3"/>
  <rect x="694" y="366" width="36" height="12" rx="6" fill="#d8b04c" stroke="#2b2118" stroke-width="3"/>
  <rect x="722" y="392" width="12" height="20" rx="3" fill="#2b2118"/>

  <!-- tapete de boas-vindas (a ponta da chave aparece) -->
  <path d="M500 598 L780 598 L812 668 L468 668 Z" fill="#5f8a3a" stroke="#2b2118" stroke-width="4"/>
  <path d="M518 610 L762 610 L786 656 L494 656 Z" fill="none" stroke="#e8d27a" stroke-width="4" stroke-dasharray="14 10"/>
  <circle cx="606" cy="633" r="9" fill="#e8d27a"/>
  <circle cx="640" cy="633" r="9" fill="#e8d27a"/>
  <circle cx="674" cy="633" r="9" fill="#e8d27a"/>
  <path d="M780 598 L812 668 L800 668 L770 612 Z" fill="#4b6e2c" stroke="#2b2118" stroke-width="3"/>
  <circle cx="804" cy="606" r="10" fill="none" stroke="#d8b04c" stroke-width="5"/>
  <line x1="796" y1="613" x2="786" y2="624" stroke="#d8b04c" stroke-width="5" stroke-linecap="round"/>

  <!-- vaso de planta -->
  <path d="M1000 470 L1080 470 L1068 540 L1012 540 Z" fill="#b5653a" stroke="#2b2118" stroke-width="4"/>
  <path d="M1040 470 C1000 420 990 360 1010 320 C1030 380 1040 420 1040 470 Z" fill="#4f8a3c" stroke="#2b2118" stroke-width="3"/>
  <path d="M1040 470 C1070 410 1100 370 1120 350 C1110 410 1080 440 1040 470 Z" fill="#5f9c47" stroke="#2b2118" stroke-width="3"/>
  <path d="M1040 470 C1030 400 1050 340 1060 300 C1070 360 1060 420 1040 470 Z" fill="#6aa84f" stroke="#2b2118" stroke-width="3"/>
</svg>
